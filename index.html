        { id: 19, title: '19. 골드 리프 모노그램', tag: '품격있는 리스', bgColor: '#FAF6EF', accentColor: '#BFA054', textColor: '#2E271D', subTextColor: '#786955', headline: '믿음과 사랑으로 맺어진 새로운 약속의 시작', subheadline: 'MONOGRAM COMMEMORATIVE BANNER' },
        { id: 20, title: '20. 퓨어 화이트 캘리그라피', tag: '순백 & 단아함', bgColor: '#FFFFFF', accentColor: '#8C7A6B', textColor: '#2B2621', subTextColor: '#7A726A', headline: '마주 본 눈빛으로 평생을 살아갈 것을 약속합니다', subheadline: 'TWO HEARTS BEATING AS ONE' },
        { id: 21, title: '21. 프리미엄 벨벳 버건디', tag: '와인 버건디', bgColor: '#38161D', accentColor: '#E6B87D', textColor: '#FFF9F5', subTextColor: '#E0CEBD', headline: '깊은 와인 향처럼 시간이 지날수록 짙어질 사랑', subheadline: 'WINTER NIGHT WEDDING CELEBRATION' }
      ];

      // 5종 마감 방법 데이터
      const FINISH_METHODS = [
        { id: 'heat_cut', name: '열재단 (기본가공)', price: 0, priceDisplay: '+0원 (무료)', description: '올 풀림을 방지하기 위해 테두리를 고온 열선으로 깔끔하게 마감합니다.', indoor: '벽면 테이프 부착용', outdoor: '실외 사용 불가', isOutdoorAllowed: false },
        { id: 'eyelet_rope', name: '아일렛타공 + 줄', price: 5000, priceDisplay: '+5,000원', description: '사방 모서리에 금속 링을 타공하고 튼튼한 끈을 함께 제공합니다.', indoor: '기둥, 파티션 고정용', outdoor: '강풍 시 찢어짐 위험', isOutdoorAllowed: false },
        { id: 'eyelet_suction', name: '아일렛타공 + 큐방', price: 8000, priceDisplay: '+8,000원', description: '사방 금속 타공 후 매끄러운 유리에 부착하는 압축 큐방 4개를 제공합니다.', indoor: '통유리창, 매끄러운 타일 부착용', outdoor: '외부 부착 불가', isOutdoorAllowed: false },
        { id: 'wood_rope', name: '사각각목 + 끈', price: 15000, priceDisplay: '+15,000원', description: '좌우 또는 상하에 각목을 대고 미싱 후 끈을 연결하여 팽팽하게 게시합니다.', indoor: '대형 로비, 천장 현수', outdoor: '야외 거치 추천 (내구성 최상)', isOutdoorAllowed: true },
        { id: 'flat_band', name: '고강도 납작밴드 덧댐', price: 0, priceDisplay: '별도 문의 필요', description: '태풍급 강풍에도 버티도록 웨빙 밴드를 원단 테두리에 박음질하는 최고급 마감입니다.', indoor: '특수 구조물 전시용', outdoor: '바람이 강한 야외, 펜스 거치', isOutdoorAllowed: true }

      // 배너 거치대 데이터
      const BANNER_STANDS = {
        none: { name: '배너대 없음 (출력물 600*1800만 구매)', price: 0, desc: '기존 거치대 보유 시 권장' },
        indoor: { name: '실내 배너대', price: 22000, desc: '웨딩홀 로비, 신부대기실 실내 전용 가벼운 거치대' },

      // 기본 날짜 계산 (오늘 + 35일)
      const defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 35);
      const defaultDateStr = defaultDate.toISOString().split('T')[0];

      // 애플리케이션 상태
      const state = {
        currentStep: 0,
        formData: {
          widthMm: 5000,
          heightMm: 900,
          eventDate: defaultDateStr,
          eventTime: '12:30',
          isUrgent: false,
          deliveryMethod: 'pickup', // pickup | parcel | quick
          selectedTemplateId: 1,
          groomName: '김민준',
          brideName: '이지은',
          weddingHall: '그랜드 앰배서더 서울 블리스홀',
          installationType: null, // indoor | outdoor
          finishMethod: null,
          addBanner: null, // boolean | null
          bannerStandType: 'none' // none | indoor | outdoor_water
        },
        faqs: {
          introFaq1: false,
          introFaq2: false,
          step1Faq1: false
        },
        activeModal: null, // 'template' | 'finish' | 'banner' | 'reset' | null
        copySuccess: false
      };

      // D-Day 및 주말 제외 영업일 계산기
      function calculateRemainingDays(dateStr, timeStr) {
        if (!dateStr) {
          return { days: 0, businessDays: 0, dDayText: '날짜를 입력해주세요', isThreeDaysOrLess: false, isParcelLocked: true };
        }
        const targetDate = new Date(`${dateStr}T${timeStr || '12:00'}:00`);
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const targetStart = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        const diffMs = targetStart.getTime() - todayStart.getTime();
        const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

        let businessDays = 0;
        if (diffDays > 0) {
          const cur = new Date(todayStart);
          cur.setDate(cur.getDate() + 1);
          while (cur <= targetStart) {
            const day = cur.getDay();
            if (day !== 0 && day !== 6) businessDays++;
            cur.setDate(cur.getDate() + 1);
          }
        }

        const isThreeDaysOrLess = diffDays <= 0 || businessDays <= 3;
        const isParcelLocked = diffDays <= 5 || businessDays <= 5;

        let dDayText = 'D-Day';
        if (diffDays > 0) dDayText = `D-${businessDays}`;
        else if (diffDays < 0) dDayText = '행사일 지남';

        return { days: diffDays, businessDays, dDayText, isThreeDaysOrLess, isParcelLocked };
      }

      // 견적 금액 계산기
      function calculateQuote() {
        const { widthMm, heightMm, finishMethod, addBanner, bannerStandType, deliveryMethod } = state.formData;
        const widthM = (widthMm || 0) / 1000;
        const heightM = (heightMm || 0) / 1000;
        const areaM2 = widthM * heightM;
        const rawBannerCost = areaM2 * 7700;
        const bannerBasePrice = Math.ceil(rawBannerCost / 1000) * 1000;

        const selectedFinish = FINISH_METHODS.find(f => f.id === finishMethod);
        const finishCost = selectedFinish ? selectedFinish.price : 0;
        const hasSpecialInquiry = finishMethod === 'flat_band';

        let bannerPrintPrice = 0;
        let bannerStandPrice = 0;
        if (addBanner === true) {
          bannerPrintPrice = 51000;
          if (bannerStandType === 'indoor') bannerStandPrice = 22000;
          else if (bannerStandType === 'outdoor_water') bannerStandPrice = 42000;
        }
        const bannerTotalAddon = bannerPrintPrice + bannerStandPrice;

        let deliveryCost = 0;
        let isQuickDelivery = false;
        if (deliveryMethod === 'parcel') deliveryCost = 6000;
        else if (deliveryMethod === 'quick') isQuickDelivery = true;

        const totalPrice = bannerBasePrice + finishCost + bannerTotalAddon + deliveryCost;

        return {
          widthM,
          heightM,
          areaM2,
          bannerBasePrice,
          finishCost,
          bannerTotalAddon,

                  </button>
                </div>
              </div>
            </div>
          `;
        }

        app.innerHTML = `
          ${stepperHTML}
          <main class="flex-1 px-4 py-6 sm:px-8 sm:py-10 bg-[#ffffff]">
            <div class="max-w-4xl mx-auto">
              ${contentHTML}
            </div>
          </main>
        `;

        renderModal();
      }

      // 모달 렌더러
      function renderModal() {
        const container = document.getElementById('modal-container');
        if (!state.activeModal) {
          container.innerHTML = '';
          return;
        }

        const selectedTmpl = TEMPLATES.find(t => t.id === state.formData.selectedTemplateId) || TEMPLATES[0];
        const selectedFinish = FINISH_METHODS.find(f => f.id === state.formData.finishMethod) || FINISH_METHODS[0];

        if (state.activeModal === 'reset') {
          container.innerHTML = `
            <div class="fixed inset-0 z-50 bg-[#1A1918]/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white p-6 sm:p-8 max-w-md w-full border border-[#1A1918] text-center space-y-5 rounded-2xl shadow-xl">
                <div class="w-12 h-12 border border-[#A64B5A] text-[#A64B5A] flex items-center justify-center mx-auto rounded-full text-xl font-bold">!</div>
                <div>
                  <h4 class="text-[20px] font-bold text-[#1A1918]">초기화 확인</h4>
                  <p class="text-[17px] font-bold text-[#A64B5A] mt-2">모든 내역이 삭제되고 처음부터 다시 시작됩니다</p>
                  <p class="text-[14px] text-[#1A1918]/70 mt-1 leading-relaxed">
                    기입하신 규격, 디자인, 마감 및 배너 옵션이<br />
                    모두 기본값으로 리셋됩니다.
                  </p>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                  <button type="button" onclick="closeModal()" class="py-3 px-4 border border-[#1A1918]/30 text-[#1A1918] text-[15px] font-bold hover:bg-stone-100 cursor-pointer rounded-lg">취소</button>
                  <button type="button" onclick="resetAll()" class="py-3 px-4 bg-[#1A1918] text-white text-[15px] font-bold hover:bg-[#333230] cursor-pointer rounded-lg">다시시작</button>
                </div>
              </div>
            </div>
          `;
          return;
        }

        let modalTitle = '';
        let modalBody = '';

        if (state.activeModal === 'template') {
          modalTitle = `선택 템플릿: ${selectedTmpl.title}`;
          modalBody = `
            <div class="w-full space-y-3">
              ${renderHorizontalBannerSVG(selectedTmpl, state.formData.groomName, state.formData.brideName, state.formData.eventDate, state.formData.weddingHall)}
              <div class="text-center text-[14px] text-stone-500">5000 × 900 비율 현수막 실물 그래픽</div>
            </div>
          `;
        } else if (state.activeModal === 'finish') {
          modalTitle = `마감 방법: ${selectedFinish.name}`;
          modalBody = `
            <div class="flex flex-col items-center space-y-3 max-w-md w-full mx-auto">
              <div class="w-64 h-64 border border-stone-200 rounded-xl overflow-hidden shadow-xs bg-stone-50">
                ${renderFinishMethodSVG(selectedFinish.id)}
              </div>
              <div class="text-center">
                <div class="text-[17px] font-bold text-[#1A1918]">${selectedFinish.name} (${selectedFinish.priceDisplay})</div>
                <p class="text-[14px] text-stone-600 mt-1">${selectedFinish.description}</p>
              </div>
            </div>
          `;
        } else if (state.activeModal === 'banner') {
          modalTitle = `스탠딩 배너: ${selectedTmpl.title}`;
          modalBody = `
            <div class="flex flex-col items-center space-y-3">
              <div class="w-64">
                ${renderVerticalBannerSVG(selectedTmpl, state.formData.groomName, state.formData.brideName, state.formData.eventDate, state.formData.weddingHall)}
              </div>
              <div class="text-center text-[14px] text-stone-500">600 × 1800 비율 스탠딩 배너 실물 그래픽</div>
            </div>
          `;
        }

        container.innerHTML = `
          <div class="fixed inset-0 z-50 bg-[#1A1918]/70 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-3xl w-full p-6 sm:p-8 space-y-4 shadow-2xl border border-[#1A1918]/20 relative max-h-[90vh] overflow-y-auto">
              <div class="flex items-center justify-between border-b border-[#1A1918]/10 pb-3">
                <h4 class="text-[19px] font-bold text-[#1A1918]">${modalTitle}</h4>
                <button type="button" onclick="closeModal()" class="p-1 text-[#1A1918]/60 hover:text-[#1A1918] text-2xl font-bold cursor-pointer">×</button>
              </div>
              <div class="py-2 flex justify-center">${modalBody}</div>
              <div class="pt-3 border-t border-[#1A1918]/10 flex justify-end">
                <button type="button" onclick="closeModal()" class="py-2.5 px-6 bg-[#1A1918] text-white font-bold text-[15px] rounded-lg hover:bg-[#333230] cursor-pointer">닫기</button>
              </div>
            </div>
          </div>
        `;
      }

      // 이벤트 핸들러 함수들
      function goToStep(step) {
        state.currentStep = step;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      }

      function updateForm(field, value) {
        state.formData[field] = value;
        renderApp();
      }

      function updateSize(field, val) {
        state.formData[field] = Math.max(0, parseInt(val, 10) || 0);
        renderApp();
      }

      function toggleFaq(key) {
        state.faqs[key] = !state.faqs[key];
        renderApp();
      }

      function selectTemplate(id) {
        state.formData.selectedTemplateId = id;
        renderApp();
      }

      function selectInstallation(type) {
        state.formData.installationType = type;
        if (type === 'outdoor') {
          // 실외 설치 시 사각각목이나 납작밴드가 아니면 사각각목으로 기본 선택
          if (state.formData.finishMethod !== 'wood_rope' && state.formData.finishMethod !== 'flat_band') {
            state.formData.finishMethod = 'wood_rope';
          }
        }
        renderApp();
      }

      function selectAddBanner(need) {
        state.formData.addBanner = need;
        if (!need) state.formData.bannerStandType = 'none';
        renderApp();
      }

      function openModal(modalType) {
        state.activeModal = modalType;
        renderModal();
      }

      function closeModal() {
        state.activeModal = null;
        renderModal();
      }

      function resetAll() {
        state.currentStep = 0;
        state.formData = {
          widthMm: 5000,
          heightMm: 900,
          eventDate: defaultDateStr,
          eventTime: '12:30',
          isUrgent: false,
          deliveryMethod: 'pickup',
          selectedTemplateId: 1,
          groomName: '김민준',
          brideName: '이지은',
          weddingHall: '그랜드 앰배서더 서울 블리스홀',
          installationType: null,
          finishMethod: null,
          addBanner: null,
          bannerStandType: 'none'
        };
        state.activeModal = null;
        renderApp();
      }

      function copyQuote() {
        const remaining = calculateRemainingDays(state.formData.eventDate, state.formData.eventTime);
        const quote = calculateQuote();
        const selectedTmpl = TEMPLATES.find(t => t.id === state.formData.selectedTemplateId) || TEMPLATES[0];
        const selectedFinish = FINISH_METHODS.find(f => f.id === state.formData.finishMethod) || FINISH_METHODS[0];

        let specialNotes = '';
        if (state.formData.isUrgent || state.formData.finishMethod === 'flat_band' || state.formData.deliveryMethod === 'quick') {
          specialNotes = `\n================================\n※ [특이사항]`;
          if (state.formData.isUrgent) {
            specialNotes += `\n★ 긴급제작요청: 행사 일정이 촉박하여 담당자 제작일정 확인 및 급행 추가금 협의가 필요합니다.`;
          }
          if (state.formData.finishMethod === 'flat_band') {
            specialNotes += `\n★ 밴드마감: 고강도 납작밴드 덧댐 특수 가공 방식으로 담당자와 별도 단가 상담이 필요합니다.`;
          }
          if (state.formData.deliveryMethod === 'quick') {
            specialNotes += `\n★ 퀵배송: 착불 또는 거리별 퀵배송 비용이 별도로 발생합니다 (견적서 금액에 미포함).`;
          }
        }

        const deliveryText =
          state.formData.deliveryMethod === 'pickup'
            ? '직접수령 (매장 방문 / 0원)'
            : state.formData.deliveryMethod === 'parcel'
            ? '택배배송 (5일 소요 / +6,000원)'
            : '퀵배송 (별도 요금 추가 / 퀵배송 미포함)';

        const text = `[탐모라 웨딩 현수막 & 배너 견적서]
--------------------------------
1. 현수막 규격: ${state.formData.widthMm}mm × ${state.formData.heightMm}mm (${quote.widthM}m × ${quote.heightM}m)
2. 행사 예정일: ${state.formData.eventDate} ${state.formData.eventTime} (${remaining.dDayText})
3. 긴급 제작 요청: ${state.formData.isUrgent ? '신청함 (추가금/일정 확인 필요)' : '일반 일정'}
4. 템플릿: ${selectedTmpl.title}
5. 설치 환경: ${state.formData.installationType === 'indoor' ? '실내 설치' : '실외 설치'}
6. 마감 방법: ${selectedFinish.name} (${selectedFinish.priceDisplay})
7. 스탠딩 배너: ${state.formData.addBanner ? `신청 (${state.formData.bannerStandType === 'none' ? '출력물만 51,000원' : state.formData.bannerStandType === 'indoor' ? '실내 배너대 포함 73,000원' : '실외 물통 배너대 포함 93,000원'})` : '미신청'}
8. 수령 방법: ${deliveryText}
--------------------------------
■ 현수막 기본금: ${formatPrice(quote.bannerBasePrice)}
■ 마감 추가금: ${formatPrice(quote.finishCost)}${quote.hasSpecialInquiry ? ' (별도 문의)' : ''}
■ 배너 추가금: ${formatPrice(quote.bannerTotalAddon)}
■ 배송비: ${state.formData.deliveryMethod === 'parcel' ? '6,000원' : state.formData.deliveryMethod === 'quick' ? '별도 추가 (미포함)' : '0원 (직접수령)'}
================================
★ 최종 예상 견적: ${formatPrice(quote.totalPrice)}${quote.hasSpecialInquiry ? ' + 납작밴드 별도상담' : ''}${quote.isQuickDelivery ? ' (퀵배송 미포함)' : ''}${specialNotes}
`;

        navigator.clipboard.writeText(text).then(() => {
          state.copySuccess = true;
          renderApp();
          setTimeout(() => {
            state.copySuccess = false;
            renderApp();
          }, 4500);
        });
      }

      // 최초 실행
      document.addEventListener('DOMContentLoaded', () => {
        renderApp();
      });
      // 즉시 실행 (DOM이 이미 로드된 경우)
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        renderApp();
      }
    </script>
  </body>
</html>
